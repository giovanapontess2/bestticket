<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Best - Gestão 360º de Entretenimento</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            best: {
              dark: '#121212',      /* Fundo MIV */
              purple: '#6E00FF',    /* Roxo Base */
              deep: '#21093A',      /* Roxo Profundo */
              green: '#A4D600',     /* Best Ticket (Financeiro/Digital) */
              pink: '#FF007F',      /* Best Events (Operação/Físico) */
              white: '#FFFFFF'
            }
          },
          fontFamily: {
            sans: ['"Bricolage Grotesque"', 'sans-serif'],
            display: ['"Monument Extended"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* ==========================================
       IMPORTAÇÃO DE FONTES LOCAIS
       ========================================== */
    
    /* Bricolage Grotesque */
    @font-face {
      font-family: 'Bricolage Grotesque';
      src: url('./BricolageGrotesque-Light.ttf') format('truetype');
      font-weight: 300;
      font-style: normal;
    }
    @font-face {
      font-family: 'Bricolage Grotesque';
      src: url('./BricolageGrotesque-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Bricolage Grotesque';
      src: url('./BricolageGrotesque-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'Bricolage Grotesque';
      src: url('./BricolageGrotesque-ExtraBold.ttf') format('truetype');
      font-weight: 800;
      font-style: normal;
    }

    /* Monument Extended */
    @font-face {
      font-family: 'Monument Extended';
      src: url('./MonumentExtended-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Monument Extended';
      src: url('./MonumentExtended-Ultrabold.otf') format('opentype');
      font-weight: 800;
      font-style: normal;
    }

    /* ==========================================
       ESTILOS CUSTOMIZADOS GERAIS
       ========================================== */
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
      100% { transform: translateY(0px); }
    }
    .animate-float { animation: float 6s ease-in-out infinite; }
    
    @keyframes shine {
      100% { left: 125%; }
    }
    .btn-shine {
      position: relative;
      overflow: hidden;
    }
    .btn-shine::after {
      content: '';
      position: absolute;
      top: 0; left: -100%; width: 50%; height: 100%;
      background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
      transform: skewX(-20deg);
      animation: shine 4s infinite;
    }
    
    .glass-panel {
      background: rgba(33, 9, 58, 0.4); /* deep purple com opacidade */
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(110, 0, 255, 0.2);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    }

    .reveal-up {
      animation: revealUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes revealUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    body { background-color: #121212; color: #FFFFFF; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function BestMediaKit() {
      const [scrolled, setScrolled] = useState(false);
      const [activeTab, setActiveTab] = useState('shows');

      useEffect(() => {
        const handleScroll = () => {
          setScrolled(window.scrollY > 50);
        };
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const eventNiches = {
        shows: {
          title: "Domine a cena local com casa cheia",
          desc: "Ideal para produtores jovens de Funk, Eletrónica e festas universitárias. Operamos o bar e a portaria para que o seu foco seja o line-up e o hype nas redes sociais.",
          stats: "+5.000 ingressos liquidados rapidamente",
          image: "./casa-cheia.png" 
        },
        clubes: {
          title: "Operação fluida para a sua Casa Noturna",
          desc: "Implementamos sistemas fixos, equipas recorrentes e gestão mensal para clubes e bares com entretenimento. Diga adeus às dores de cabeça com escalas de funcionários.",
          stats: "Contrato Fixo & Previsibilidade",
          image: "./casa-n.png" 
        },
        festivais: {
          title: "Infraestrutura pesada para Festivais",
          desc: "Para eventos de rua, food parks e grandes festivais. Resolvemos alvarás, fechamos ruas, distribuímos dezenas de PDVs móveis e garantimos o abastecimento logístico.",
          stats: "Gestão 360º de F&B (Alimentos e Bebidas)",
          image: "./festival.png" 
        }
      };

      return (
        <div className="min-h-screen bg-best-dark text-best-white selection:bg-best-purple selection:text-white overflow-x-hidden">
          
          {/* NAVEGAÇÃO STICKY */}
          <nav className={`fixed top-0 w-full z-50 transition-all duration-300 ${scrolled ? 'bg-best-dark/95 backdrop-blur-md border-b border-best-purple/20 py-4' : 'bg-transparent py-6'}`}>
            <div className="max-w-7xl mx-auto px-6 flex items-center justify-between">
              
              {/* LOGO BEST (Via SVG Local) */}
              <div className="flex items-center cursor-pointer group h-10">
                <img src="./logo-best.svg" alt="Logo Best" className="h-full w-auto object-contain transition-transform duration-300 group-hover:scale-105" />
              </div>

              <button className="hidden md:flex bg-best-purple text-white px-6 py-2.5 rounded-none font-bold text-sm hover:scale-105 transition-all duration-300 items-center gap-2 btn-shine uppercase tracking-wide">
                Falar com Consultor
              </button>
            </div>
          </nav>

          {/* SECÇÃO 1: HERO (IMPACTO COM IMAGEM DE FUNDO) */}
          <section className="relative pt-40 pb-32 px-6 flex flex-col justify-center items-center text-center min-h-[90vh]">
            <div className="absolute inset-0 z-0">
              <img src="./festival.png" alt="Pista de Dança" className="w-full h-full object-cover opacity-20 mix-blend-luminosity" />
              <div className="absolute inset-0 bg-gradient-to-b from-best-dark/90 via-best-deep/60 to-best-dark"></div>
            </div>
            
            <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-best-purple/20 blur-[120px] rounded-full pointer-events-none animate-pulse"></div>
            
            <div className="relative z-10 reveal-up">
              <span className="px-5 py-2 border border-best-purple/50 bg-best-purple/10 text-best-purple text-xs font-bold tracking-widest uppercase mb-8 inline-block backdrop-blur-sm">
                Gestão 360º de Entretenimento

              </h1>
              
              <p className="text-xl md:text-2xl text-zinc-300 max-w-3xl mx-auto font-light mb-12 leading-relaxed">
                Do staff treinado à bilheteira digital: nós absorvemos o caos logístico para que se possa focar apenas numa coisa: <strong className="text-white font-bold">o Sold Out.</strong>
              </p>
              
              <div className="flex flex-col sm:flex-row gap-5 justify-center items-center">
                <button className="bg-best-white text-best-dark px-8 py-4 font-display font-bold text-sm uppercase hover:scale-105 transition-all duration-300 flex items-center gap-2 tracking-wider">
                  Descubra o Padrão Best <i className="ph ph-arrow-right text-[20px]"></i>
                </button>
              </div>
            </div>
          </section>

          {/* SECÇÃO 2: A CONEXÃO (INFOGRÁFICO DE FLUXO) */}

                <div className="absolute top-0 right-0 w-64 h-64 bg-best-green/10 blur-[80px] rounded-full"></div>
                
                <div className="flex flex-col lg:flex-row gap-12 items-center relative z-10">

                    <p className="text-zinc-400 text-lg leading-relaxed mb-6">
                      A Best não é apenas uma plataforma digital. Somos a <strong>ponte física e tecnológica</strong> que assume o controlo de cada ponto de contacto.
                    </p>
                  </div>
                  
                  <div className="w-full lg:w-2/3 grid grid-cols-2 md:grid-cols-4 gap-4">
                    {/* Item Ticket - Cor Verde Neon */}
                    <div className="bg-best-dark/80 border border-best-green/30 rounded-xl p-5 hover:-translate-y-2 hover:border-best-green transition-all duration-300 group cursor-default">
                      <i className={`ph ph-ticket text-[32px] text-best-green group-hover:animate-pulse transition-colors mb-4 block`}></i>
                      <h4 className="text-white font-bold mb-2">Bilheteira</h4>
                      <p className="text-zinc-400 text-xs">Venda online e física antifraude com liquidez rápida.</p>
                    </div>

                    {/* Itens Operação - Cor Rosa/Magenta Neon */}
                    <div className="bg-best-dark/80 border border-best-pink/30 rounded-xl p-5 hover:-translate-y-2 hover:border-best-pink transition-all duration-300 group cursor-default">
                      <i className={`ph ph-shield-check text-[32px] text-best-pink group-hover:animate-pulse transition-colors mb-4 block`}></i>
                      <h4 className="text-white font-bold mb-2">Triagem</h4>
                      <p className="text-zinc-400 text-xs">Controlo de acesso ultra-rápido e equipa treinada.</p>
                    </div>
                    
                    <div className="bg-best-dark/80 border border-best-pink/30 rounded-xl p-5 hover:-translate-y-2 hover:border-best-pink transition-all duration-300 group cursor-default">

                      <i className={`ph ph-beer-bottle text-[32px] text-best-pink group-hover:animate-pulse transition-colors mb-4 block`}></i>
                      <h4 className="text-white font-bold mb-2">Bar & Cashless</h4>
                      <p className="text-zinc-400 text-xs">Pagamento rápido, bebida consignada e zero filas.</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* SECÇÃO EXTRA: VÍDEO PROMOCIONAL */}
          <section className="py-24 px-6 relative z-20 bg-best-dark border-t border-zinc-800/50">
            <div className="max-w-7xl mx-auto">
              <div className="text-center mb-12">
                <span className="text-best-purple font-bold tracking-widest text-sm uppercase mb-4 block">Nós Vivemos a Noite</span>
                <h2 className="text-4xl md:text-5xl font-display font-bold tracking-normal uppercase">A Energia da Pista</h2>
              </div>

                <video 
                  src="./video-best.mp4" 
                  className="w-full h-[500px] md:h-[700px] object-cover mix-blend-luminosity opacity-80 group-hover:opacity-100 group-hover:mix-blend-normal transition-all duration-700"
                  autoPlay 
                  loop 
                  muted 
                  playsInline
                ></video>
                
                {/* Degradê para integrar o vídeo ao fundo escuro */}
                <div className="absolute inset-0 bg-gradient-to-t from-best-dark/90 via-best-dark/20 to-transparent pointer-events-none"></div>
                <div className="absolute inset-0 bg-best-purple/10 pointer-events-none mix-blend-overlay"></div>
                
                {/* Badge flutuante no vídeo */}
                <div className="absolute bottom-8 left-8 md:bottom-12 md:left-12 z-10">
                  <div className="glass-panel px-6 py-3 rounded-none border border-best-pink/50 bg-best-pink/10 flex items-center gap-3">
                    <div className="w-3 h-3 rounded-full bg-best-pink animate-pulse"></div>
                    <span className="text-best-pink font-display font-bold tracking-widest uppercase text-sm">Modo Best Ativado</span>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* SECÇÃO 3: NICHOS DE EVENTOS */}
          <section className="py-24 px-6 bg-best-deep/20 border-t border-zinc-800/50">
            <div className="max-w-7xl mx-auto">
              <div className="text-center mb-12">
                <h2 className="text-4xl md:text-5xl font-display font-bold tracking-normal mb-4 uppercase">Onde fazemos a diferença.</h2>
                <p className="text-zinc-400 text-lg">Soluções modulares para cada tipo de espetáculo.</p>
              </div>

              <div className="flex flex-col sm:flex-row gap-2 bg-best-dark p-2 rounded-xl mb-12 max-w-3xl mx-auto border border-zinc-800">
                {[
                  { id: 'shows', label: 'Eventos & Shows', icon: 'ph-music-notes' },
                  { id: 'clubes', label: 'Casas Noturnas', icon: 'ph-buildings' },
                  { id: 'festivais', label: 'Festivais', icon: 'ph-tent' }
                ].map((tab) => (
                  <button 
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex-1 py-4 px-6 rounded-lg font-bold flex items-center justify-center gap-2 transition-all duration-300 ${
                      activeTab === tab.id 
                      ? 'bg-best-purple text-white shadow-[0_0_20px_rgba(110,0,255,0.4)]' 
                      : 'text-zinc-500 hover:bg-zinc-900 hover:text-zinc-300 border border-transparent'
                    }`}
                  >
                    <i className={`ph ${tab.icon} text-[18px]`}></i> {tab.label}
                  </button>
                ))}
              </div>

              <div className="bg-best-dark border border-best-purple/30 rounded-2xl overflow-hidden shadow-2xl flex flex-col md:flex-row">
                <div className="p-12 w-full md:w-1/2 flex flex-col justify-center">
                  <h3 className="text-3xl md:text-4xl font-display font-bold mb-6 tracking-normal uppercase">{eventNiches[activeTab].title}</h3>
                  <p className="text-zinc-400 text-lg mb-10 leading-relaxed">
                    {eventNiches[activeTab].desc}
                  </p>
                  <div>
                    <a href="#" className="text-best-purple font-bold flex items-center gap-2 hover:text-best-pink transition-colors group uppercase tracking-wider text-sm">

                    </a>

                </div>
                
                <div className="w-full md:w-1/2 relative min-h-[400px]">
                  <img 
                    src={eventNiches[activeTab].image} 
                    alt="Evento" 
                    className="absolute inset-0 w-full h-full object-cover opacity-50 mix-blend-luminosity" 
                  />
                  <div className="absolute inset-0 bg-gradient-to-r from-best-dark to-transparent w-32"></div>
                  
                  <div className="absolute top-8 right-8 bg-best-deep/80 backdrop-blur-md border border-best-purple/50 p-4 rounded-xl animate-float shadow-xl">
                    <p className="text-best-pink text-xs font-bold uppercase mb-1">Métrica Real</p>
                    <p className="text-white font-black text-xl flex items-center gap-2">
                      <i className="ph ph-trend-up text-[18px] text-best-green"></i> {eventNiches[activeTab].stats}
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* SECÇÃO 4: A NOSSA FORÇA BRAÇAL */}
          <section className="py-24 px-6 border-y border-zinc-800/50">
            <div className="max-w-7xl mx-auto">
              <div className="flex flex-col lg:flex-row gap-16 items-center">
                
                <div className="w-full lg:w-5/12">
                  <span className="text-best-pink font-bold tracking-widest text-sm uppercase mb-4 block">Muito além do Digital</span>
                  <h2 className="text-4xl md:text-5xl font-display font-bold tracking-normal mb-6 uppercase leading-snug">Software não carrega gelo. Nós sim.</h2>

                  <ul className="space-y-6 mb-8">
                    <li className="flex gap-4 items-start">
                      <div className="bg-best-pink/10 p-3 rounded-none border border-best-pink/30 text-best-pink mt-1"><i className="ph ph-users text-[24px]"></i></div>
                      <div>
                        <h4 className="font-bold text-white text-lg">Pool de +400 Freelancers</h4>
                        <p className="text-sm text-zinc-400 mt-1">Caixas, barmans e portaria "Padrão Best". Se alguém faltar, substituímos na hora.</p>
                      </div>
                    </li>
                    <li className="flex gap-4 items-start">
                      <div className="bg-best-pink/10 p-3 rounded-none border border-best-pink/30 text-best-pink mt-1"><i className="ph ph-shield-check text-[24px]"></i></div>
                      <div>
                        <h4 className="font-bold text-white text-lg">Domínio Burocrático</h4>
                        <p className="text-sm text-zinc-400 mt-1">Mais de 90% dos alvarás de Piracicaba passam e são aprovados pelas nossas mãos.</p>
                      </div>
                    </li>
                    <li className="flex gap-4 items-start">
                      <div className="bg-best-pink/10 p-3 rounded-none border border-best-pink/30 text-best-pink mt-1"><i className="ph ph-beer-bottle text-[24px]"></i></div>
                      <div>

                </div>

                <div className="w-full lg:w-7/12 grid grid-cols-2 gap-4 h-[600px]">
                  <div className="space-y-4 h-full">
                    {/* Consignação Total */}
                    <div className="h-2/5 rounded-xl overflow-hidden relative group border border-zinc-800">
                      <img src="./consignacao.png" alt="Bebidas Bar" className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700 opacity-60 mix-blend-luminosity" />
                      <div className="absolute inset-0 bg-gradient-to-t from-best-dark to-transparent"></div>

                      <div className="absolute bottom-4 left-4 border border-best-pink/50 bg-best-pink/10 backdrop-blur-sm px-3 py-1 text-best-pink text-xs font-bold uppercase">Gestão de Bares (A&B)</div>

                  </div>

              </div>
            </div>
          </section>

          {/* SECÇÃO 5: PREÇOS E MÓDULOS */}
          <section className="py-32 px-6 bg-best-dark">
            <div className="max-w-7xl mx-auto">
              <div className="text-center mb-20">
                <h2 className="text-4xl md:text-6xl font-display font-bold tracking-normal mb-6 uppercase">A Oferta Best</h2>

                  <div className="text-xs font-bold uppercase tracking-widest text-zinc-500 mb-2">Módulo 1</div>
